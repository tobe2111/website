# Cloudflare Workers 설정 — 서초구 상인회 플랫폼 (무료 티어로 배포 가능)
# 배포 전:  wrangler d1 create seocho-db   /   wrangler r2 bucket create seocho-media
# 그 뒤 아래 database_id 를 채우고:  wrangler deploy
name = "website"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 정적 자산(css/js) — Workers 에 함께 배포되어 자동 서빙
# 배포 버전 ID (CSS/JS 캐시 자동 무력화용)
[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "./public"
binding = "ASSETS"

# 주간 정기 작업 — 매주 일요일 18:00 UTC(월요일 새벽 3시 KST):
# ① 전체 데이터 암호화 백업 → R2 backups/ (8주 보존, 복호화: scripts/decrypt-backup.mjs)
# ② 상인회별 주간 운영 리포트 메일 (RESEND_API_KEY 설정 시)
[triggers]
crons = ["0 18 * * 0", "0 0 * * *", "*/5 * * * *"]  # 주간(월 03시 KST) + 매일(09시 KST 서명 리마인더) + 5분(웹훅 전송)

# D1 (SQLite) — 무료 티어: 5GB, 하루 5백만 읽기
[[d1_databases]]
binding = "DB"
database_name = "seocho-db"
database_id = "49a1f920-9286-4ce3-aa5c-6cdb7cdbdd3e"

# R2 (오브젝트 스토리지, 사진) — 무료 티어: 10GB 저장, 전송(egress) 무료
# ⚠️ 배포 전에 R2 에서 `seocho-media` 버킷을 먼저 만들어야 합니다.
#    (R2 활성화에 카드 등록 필요 — 무료 한도 내 청구 0원)
# 사진 업로드 없이 먼저 띄우려면 아래 3줄을 주석(#) 처리해도 사이트는 정상 동작합니다.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "seocho-media"

# 공개 시크릿은 `wrangler secret put` 으로 등록 (SESSION_SECRET 등).
# 일반 설정값:
[vars]
PUBLIC_SCHEME = "https"
# 정기 작업(크론)이 알림톡 버튼에 넣을 절대 주소. 크론에는 요청이 없어 도메인을 알 수 없다.
# 비워 두면 관리자가 문서를 만들 때 자동으로 학습해 저장하지만, 여기 적어 두는 편이 확실하다.
# 상인회에 개별 도메인이 연결되어 있으면 그 도메인이 우선 적용된다.
PUBLIC_ORIGIN = "https://website.tobe211167.workers.dev"
# BASE_DOMAIN = "example.com"        # 서브도메인 방식 쓸 때
# 네이버 지도 Client ID (도메인 화이트리스트로 보호되는 공개 값 — 콘솔에 배포 도메인 등록 필요).
# ⚠️ Client Secret 은 지도에 불필요하며 여기에 절대 넣지 마세요.
NAVER_MAP_CLIENT_ID = "5mvveclqay"   # Maps 콘솔의 "urdeal-sanginhoe" 앱 (Dynamic Map)
# 지도가 안 뜨면 ncpClientId <-> ncpKeyId 로 바꿔보세요(콘솔 버전 차이).
# Maps 콘솔(신규) 앱은 ncpKeyId 사용. (구 AI·NAVER API 앱만 ncpClientId)
# 주의: 이 파일 값이 대시보드 변수보다 우선 적용됨(배포 시 덮어씀) — 변경은 여기서!
NAVER_MAP_PARAM = "ncpKeyId"
# Turnstile(무료 봇 차단) — 대시보드에서 발급한 사이트키를 넣으면 자동 활성화.
# 사진 서빙 워커 우회 (선택 · 서버리스 순도↑): R2 버킷에 공개 도메인을 켜고 그 주소를 넣으면
# 사진이 워커를 거치지 않고 R2→CDN 직행 (워커 요청 한도 절약). 설정법: DEPLOY-cloudflare.md 참고.
# MEDIA_PUBLIC_BASE = "https://pub-xxxxxxxxxxxx.r2.dev"

# 이메일 자동 발송 (비번 재설정 링크·입점 승인 안내) — Resend(https://resend.com) 무료 플랜 가능.
# 설정법: 대시보드 → Settings → Variables 에 RESEND_API_KEY(Secret), MAIL_FROM 등록. 없으면 수동 안내 폴백.
# MAIL_FROM = "상인회 플랫폼 <no-reply@내도메인.kr>"   # Resend 에 도메인 인증 필요
# 시크릿은 `wrangler secret put TURNSTILE_SECRET` 로 등록. 둘 다 없으면 캡차 비활성.
# TURNSTILE_SITE_KEY = "0x4AAAAAAA..."
# Cloudflare Web Analytics(무료 방문 통계) — 대시보드에서 발급한 토큰. 넣으면 자동 삽입.
# CF_ANALYTICS_TOKEN = "xxxxxxxx"
# R2 퍼블릭 URL(사진 공개 접근). R2 버킷에 공개 도메인 연결 후 넣으세요.
# MEDIA_PUBLIC_BASE = "https://media.example.com"
