# Cloudflare Workers 설정 — 서초구 상인회 플랫폼 (무료 티어로 배포 가능)
# 배포 전:  wrangler d1 create seocho-db   /   wrangler r2 bucket create seocho-media
# 그 뒤 아래 database_id 를 채우고:  wrangler deploy
name = "seocho-website"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 정적 자산(css/js) — Workers 에 함께 배포되어 자동 서빙
[assets]
directory = "./public"
binding = "ASSETS"

# D1 (SQLite) — 무료 티어: 5GB, 하루 5백만 읽기
[[d1_databases]]
binding = "DB"
database_name = "seocho-db"
database_id = "49a1f920-9286-4ce3-aa5c-6cdb7cdbdd3e"

# R2 (오브젝트 스토리지, 사진) — 무료 티어: 10GB 저장, 전송(egress) 무료
# ⚠️ 배포 전에 R2 에서 `seocho-media` 버킷을 먼저 만들어야 합니다.
#    (R2 활성화에 카드 등록 필요 — 무료 한도 내 청구 0원)
# 사진 업로드 없이 먼저 띄우려면 아래 3줄을 주석(#) 처리해도 사이트는 정상 동작합니다.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "seocho-media"

# 공개 시크릿은 `wrangler secret put` 으로 등록 (SESSION_SECRET 등).
# 일반 설정값:
[vars]
PUBLIC_SCHEME = "https"
# BASE_DOMAIN = "example.com"        # 서브도메인 방식 쓸 때
# 네이버 지도 Client ID (도메인 화이트리스트로 보호되는 공개 값 — 콘솔에 배포 도메인 등록 필요).
# ⚠️ Client Secret 은 지도에 불필요하며 여기에 절대 넣지 마세요.
NAVER_MAP_CLIENT_ID = "8nkkau8yrp"
# 지도가 안 뜨면 ncpClientId <-> ncpKeyId 로 바꿔보세요(콘솔 버전 차이).
NAVER_MAP_PARAM = "ncpClientId"
# Turnstile(무료 봇 차단) — 대시보드에서 발급한 사이트키를 넣으면 자동 활성화.
# 시크릿은 `wrangler secret put TURNSTILE_SECRET` 로 등록. 둘 다 없으면 캡차 비활성.
# TURNSTILE_SITE_KEY = "0x4AAAAAAA..."
# Cloudflare Web Analytics(무료 방문 통계) — 대시보드에서 발급한 토큰. 넣으면 자동 삽입.
# CF_ANALYTICS_TOKEN = "xxxxxxxx"
# R2 퍼블릭 URL(사진 공개 접근). R2 버킷에 공개 도메인 연결 후 넣으세요.
# MEDIA_PUBLIC_BASE = "https://media.example.com"
