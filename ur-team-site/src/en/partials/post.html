<article class="post">
  <header class="post__head">
    <div class="wrap wrap--narrow">
      <p class="crumb"><a href="/en/">Home</a><span aria-hidden="true">/</span><a href="/en/blog/">Insights</a></p>
      <p class="eyebrow">{{postCategory}} · <time datetime="{{postDate}}">{{postDateDot}}</time></p>
      <h1 class="h2">{{postTitle}}</h1>
    </div>
  </header>
  <div class="wrap wrap--narrow">
    {{postCover}}
    <div class="prose">
{{postBody}}
    </div>
    <p class="post__back"><a class="btn btn--ghost" href="/en/blog/">Back to Insights</a></p>
  </div>
</article>

{{postRelated}}
