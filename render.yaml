# Render Blueprint — 깃허브 연결 후 "New + → Blueprint"로 이 파일을 읽히면 자동 구성됩니다.
# 문서: https://render.com/docs/blueprint-spec
#
# 핵심: 이 앱은 SQLite DB·업로드 사진·전자서명 키를 파일로 저장하므로
#       반드시 "영속 디스크(disk)"가 필요합니다. 디스크는 유료 플랜(Starter~)에서만 지원됩니다.
#       무료 플랜은 재배포 시 데이터가 사라지고 일정 시간 후 잠들어 실서비스에 부적합합니다.

services:
  - type: web
    name: seocho-website
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter                 # 영속 디스크 사용을 위해 유료 플랜 필요(~$7/월). 디스크 1GB ≈ +$0.25/월
    # 최초 부팅 시 시드(멱등: 이미 있으면 건너뜀) 후 서버 시작
    dockerCommand: sh -c "node --experimental-sqlite src/seed.js && node --experimental-sqlite src/server.js"
    healthCheckPath: /healthz
    autoDeploy: true              # 깃허브 push 시 자동 재배포
    disk:
      name: data
      mountPath: /app/data        # DB·업로드·서명키가 모두 여기에 저장되어 영구 보존
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /app/data/app.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      # 세션 서명 키 — Render 가 안전한 랜덤값을 자동 생성
      - key: SESSION_SECRET
        generateValue: true
      # 아래 계정/키는 대시보드에서 직접 입력(sync:false → 저장소에 노출 안 됨).
      # ⚠️ 최초 배포 "전에" 값을 넣어야 시드가 그 비밀번호로 계정을 만듭니다.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # 선택: 네이버 지도 키(없으면 목록 폴백)
      - key: NAVER_MAP_CLIENT_ID
        sync: false
      # 선택: 사진을 R2/S3 로 저장할 때
      - key: STORAGE_DRIVER
        value: local
