# 기사 지금 모으기 — 아침 크론을 기다리지 않고 한 번 돌린다.
#
# 평소에는 워커의 일일 크론(아침 9시 KST)과 관리 화면의 [지금 한 번 찾아보기] 가 한다.
# 이 워크플로는 **둘 다 누를 수 없을 때**를 위한 것이다 — 작업 환경에서는 라이브 사이트에
# 닿지 못하기 때문이다. 러너는 인터넷이 열려 있으므로 제품과 **똑같은 코드**를 불러 돌린다.
#
# 넣는 것은 '대기(new)' 뿐이다. 홈에 올리는 판단은 여기서 하지 않는다 —
# 그 판단은 관리 화면에서 사람이 한다(언론 보도 화면의 [홈에 올리기]).
#
# 네이버 검색 열쇠는 라이브 DB 에서 읽어 쓰고 즉시 가린다(::add-mask::). 로그에 안 찍힌다.

name: 기사 지금 모으기

# 이 세션의 깃허브 자격으로는 '손으로 돌리기'(workflow_dispatch)가 403 이라,
# 이 파일이 바뀐 푸시에도 한 번 돌게 둔다. 같은 주소는 다시 안 들어가므로 여러 번 돌아도 무해하다.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/press-collect.yml'
      - '.github/scripts/press-collect.mjs'

permissions:
  contents: read

concurrency:
  group: press-collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 포털에서 모아 대기 줄에 넣는다
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/press-collect.mjs | tee -a $GITHUB_STEP_SUMMARY
