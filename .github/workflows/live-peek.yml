# 라이브에 지금 무엇이 들어 있나 — 숫자만 읽어 온다 (읽기 전용).
#
# 왜 필요한가. 화면이 "밋밋하다" 는 말은 디자인 탓일 수도, 채울 것이 안 채워진 탓일
# 수도 있다. 사진 없는 가게가 백 곳이면 어떤 디자인을 얹어도 회색 상자 백 개다.
# 둘을 가르려면 라이브의 숫자를 봐야 하는데, 작업 환경에서는 사이트에 닿지 않는다.
#
# 손으로 눌러야만 돌고, SELECT 만 한다. 쓰는 문장이 섞이면 아래에서 멈춘다.
# 개인정보는 읽지 않는다 — 이름·전화번호·주소는 한 줄도 꺼내지 않고 **갯수만** 센다.

name: 라이브 현황 보기

# 이 세션의 깃허브 자격으로는 '손으로 돌리기'(workflow_dispatch)가 403 이라,
# 이 파일이 바뀐 푸시에도 한 번 돌게 둔다. 읽기 전용이라 여러 번 돌아도 무해하다.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-peek.yml'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 숫자를 읽기 전에 사이트를 한 번 깨운다.
      #
      # 표·컬럼이 늘어난 배포는 **첫 요청**에서 스키마를 올린다. 배포 워크플로는 사이트를
      # 찌르지 않으므로, 아무도 안 들어온 사이에 이 화면을 열면 "no such table" 이 뜬다 —
      # 새 표가 안 만들어진 것인지, 아직 아무도 안 들어온 것인지를 구별할 수 없다.
      # 한 번 열어 두면 그 구별이 필요 없어진다.
      - name: 사이트를 한 번 깨운다 (스키마가 올라오게)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://xn--bb0bw4x46a2a173sv7g.kr/ || echo 000)
          echo "깨우기 → HTTP $code" | tee -a $GITHUB_STEP_SUMMARY
          sleep 3

      # 숫자 말고 **화면**도 한 번 읽는다.
      #
      # D1 에 기사가 열다섯 건 있다는 것과, 손님이 그 기사를 본다는 것은 다른 말이다.
      # 배포가 올라갔는데 홈이 예전 모양으로 뜨는 사고를 숫자로는 못 잡는다.
      # 그래서 홈과 기사 목록을 받아 와 **표시가 몇 개 보이는지**만 센다. 본문은 안 남긴다.
      - name: 화면이 그 모양으로 뜨는가
        run: |
          site=https://xn--bb0bw4x46a2a173sv7g.kr
          peek() {
            f=$(mktemp)
            code=$(curl -s -o "$f" -w '%{http_code}' --max-time 30 "$site$1" || echo 000)
            echo "- \`$1\` → HTTP $code · $(wc -c <"$f") 바이트" | tee -a $GITHUB_STEP_SUMMARY
            shift
            for pat in "$@"; do
              n=$(grep -o "$pat" "$f" | wc -l)
              echo "    - \`$pat\` ×$n" | tee -a $GITHUB_STEP_SUMMARY
            done
            rm -f "$f"
          }
          echo "### 화면" | tee -a $GITHUB_STEP_SUMMARY
          peek "/" 'press-stand' 'press-lead' 'pr-row' 'fest-cover' '전체보기'
          peek "/press" 'pr-row' '언론 속의'

      # 스타일시트가 **그 배포의 것인지**를 본다.
      #
      # "고쳤는데 라이브는 그대로다" 의 범인은 거의 늘 둘 중 하나다 — 배포가 안 갔거나,
      # 브라우저가 옛 파일을 들고 있거나. 앞은 여기서 바로 가려진다.
      # 홈 HTML 이 가리키는 주소 그대로(?v=... 포함) 받아 와, 고친 규칙이 들어 있는지만 센다.
      - name: 스타일시트가 새 것인가
        run: |
          site=https://xn--bb0bw4x46a2a173sv7g.kr
          home=$(mktemp); curl -s --max-time 30 "$site/" -o "$home"
          css=$(grep -o '/css/app\.css?v=[A-Za-z0-9]*' "$home" | head -1)
          echo "- 홈이 가리키는 스타일시트: \`${css:-찾지 못함}\`" | tee -a $GITHUB_STEP_SUMMARY
          if [ -n "$css" ]; then
            f=$(mktemp); curl -s --max-time 30 "$site$css" -o "$f"
            echo "- 받은 크기: $(wc -c <"$f") 바이트" | tee -a $GITHUB_STEP_SUMMARY
            for pat in 'aspect-ratio:auto 16/9' 'object-fit:contain' 'aspect-ratio:16/9;max-height:440px'; do
              n=$(grep -o -- "$pat" "$f" | wc -l)
              echo "    - \`$pat\` ×$n" | tee -a $GITHUB_STEP_SUMMARY
            done
            rm -f "$f"
          fi
          rm -f "$home"

      - name: 숫자만 읽어 온다
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "### $1" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # 로그와 요약 양쪽에 찍는다 — 요약은 사람이 보기 좋고, 로그는 API 로 읽힌다
            npx --yes wrangler@4 d1 execute seocho-db --remote --yes --command "$2" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }
          q "조직" "SELECT id, slug, name, brand_color, CASE WHEN hero_image='' THEN '없음' ELSE '있음' END AS 대문사진, CASE WHEN logo='' THEN '없음' ELSE '있음' END AS 로고, CASE WHEN tagline='' THEN '없음' ELSE tagline END AS 한줄소개, sns_instagram FROM associations"
          q "가게 — 얼마나 채워졌나" "SELECT association_id AS 조직, COUNT(*) AS 전체, SUM(status='approved') AS 공개, SUM(lat IS NOT NULL AND lat<>0) AS 지도, SUM(description<>'') AS 소개글, SUM(hours<>'') AS 영업시간, SUM(phone<>'') AS 전화 FROM businesses GROUP BY association_id"
          q "가게 사진·영상" "SELECT b.association_id AS 조직, m.kind AS 종류, COUNT(DISTINCT b.id) AS 가게수, COUNT(m.id) AS 장수 FROM businesses b JOIN media m ON m.business_id=b.id GROUP BY b.association_id, m.kind"
          q "홈 대문에 선 행사 (지나면 스스로 사라진다)" "SELECT id, association_id AS 조직, event_date AS 날짜, title FROM events WHERE cover=1"
          q "홈에 올라간 것" "SELECT a.id AS 조직, a.name, (SELECT COUNT(*) FROM notices n WHERE n.association_id=a.id) AS 공지, (SELECT COUNT(*) FROM events e WHERE e.association_id=a.id) AS 행사, (SELECT COUNT(*) FROM popups p WHERE p.association_id=a.id AND p.enabled=1) AS 팝업 FROM associations a"
          # 표가 있는지 먼저 묻는다 — 없을 때 그냥 질의하면 사람이 읽기 어려운 API 오류가 찍힌다
          q "언론 보도 — 표가 생겼나" "SELECT name FROM sqlite_master WHERE type='table' AND name='press'"
          q "언론 보도 — 수집이 도는가" "SELECT association_id AS 조직, status AS 상태, COUNT(*) AS 건수, MAX(published_at) AS 최신기사 FROM press GROUP BY association_id, status"
          q "언론 보도 — 켜져 있는가" "SELECT key, value FROM settings WHERE key LIKE 'press\_%' ESCAPE '\' OR key='press_run'"
          q "홈 구성" "SELECT id, name, CASE WHEN home_layout IS NULL THEN '기본값 그대로' ELSE '직접 고침' END AS 구성 FROM associations"
