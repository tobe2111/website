# 내용 반영 — 홈페이지에 뜰 글을 라이브 DB 에 넣는다.
#
# 왜 이게 필요한가.
# 공지·행사는 보통 관리자 화면에서 등록한다. 그게 정상이고, 이 워크플로는 그걸 대신하지 않는다.
# 다만 포스터 여러 장을 한 번에 옮겨 적는 것처럼 **손으로 치면 오타가 나는 분량**이 있다.
# 그런 것만 cloudflare/content/*.sql 에 적어 두고 여기서 반영한다.
#
# 언제 도나 — 기본 브랜치에서 **cloudflare/content/ 안이 바뀐 푸시**, 그리고 손으로 누를 때.
# 다른 푸시로는 돌지 않는다. SQL 을 직접 써 넣는 칸은 없다 — 그 칸을 만들면 저장소에
# 쓰기 권한이 있는 누구나 라이브 DB 에 아무 문장이나 넣을 수 있다.
#
# ⚠️ cloudflare/content/ 에 넣는 파일이 지켜야 할 것 — 여기서 여러 번 돌 수 있다:
#   · 두 번 돌아도 줄이 늘지 않을 것 (이미 있으면 건너뛰기)
#   · 이미 들어간 줄을 되돌리지 말 것 — 관리자가 화면에서 고친 내용을 파일이 덮어 버리면
#     고친 사람은 자기가 뭘 잘못했는지 알 수 없다
#   · 지우지 말 것 (DELETE·DROP 금지). 아래에서 기계가 한 번 더 막는다

name: 내용 반영

on:
  push:
    paths:
      - 'cloudflare/content/**'
      - '.github/workflows/content-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 지우는 문장이 섞여 들어오면 여기서 멈춘다. 되돌릴 수 없는 일이라
      # "사람이 봤겠지" 에 기대지 않는다.
      - name: 지우는 문장이 없는지 본다
        run: |
          if grep -rniE '(^|[^A-Za-z_])(delete|drop|truncate|alter)[[:space:]]' cloudflare/content/*.sql; then
            echo "::error::내용 파일에 지우거나 구조를 바꾸는 문장이 있습니다. 내용 파일은 넣기만 합니다."
            exit 1
          fi
          echo "✓ 넣는 문장만 있습니다"

      # 새 칸(ALTER TABLE)은 배포 뒤 **첫 요청**에 붙는다. 아직 아무도 사이트를 안 열었으면
      # 칸이 없는 상태라 아래 INSERT 가 통째로 실패한다. 그래서 먼저 한 번 깨운다.
      #
      # 다만 이것만으로는 모자랐다 — 아래 '반영' 의 긴 주석을 보라.
      - name: 사이트를 한 번 깨운다 (새 칸 적용)
        run: curl -fsS -o /dev/null --retry 3 --max-time 30 https://website.tobe211167.workers.dev/ || true

      - name: 무엇을 넣는지 먼저 보여 준다
        run: |
          for f in cloudflare/content/*.sql; do
            echo "### $f" >> $GITHUB_STEP_SUMMARY
            echo '```sql' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      # 파일 하나씩 돈다. 파일이 늘어도 이 워크플로를 고칠 일이 없다.
      #
      # ⚠️ 왜 다시 시도하나 — 실제로 한 번 터진 자리다.
      #
      # 새 칸을 쓰는 내용 파일(events.cover)을 그 칸을 만드는 코드와 **같은 푸시**에 넣었더니
      # 여기서 `no such column: cover` 로 멈췄다. 이 워크플로와 '배포' 가 같은 푸시에 나란히
      # 출발하는데, 위에서 사이트를 깨울 때는 아직 **옛 워커**가 서비스 중이라 마이그레이션이
      # 안 돌기 때문이다. 깨우기 한 번으로는 못 막는다 — 경주의 결과가 그때그때 다르다.
      #
      # 순서를 강제하는 길(workflow_run 으로 배포 뒤에 돌리기)도 있지만, 그러면 이 파일이
      # 기본 브랜치에 있어야만 도는 등 규칙이 하나 더 는다. 내용 파일은 어차피 '두 번 돌아도
      # 같아야 한다' 는 계약을 이미 지키므로(맨 위 주석), **될 때까지 다시 돌리는** 쪽이
      # 규칙을 안 늘리면서 이 경주를 통째로 없앤다. 성공한 파일을 다시 돌려도 아무 일이 없다.
      - name: 라이브 DB 에 반영 (배포가 늦으면 될 때까지 다시)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          attempt=1
          max=6
          while :; do
            failed=""
            for f in cloudflare/content/*.sql; do
              echo "── $f (${attempt}번째)"
              npx --yes wrangler@4 d1 execute seocho-db --remote --yes --file="$f" || failed="$failed $f"
            done
            if [ -z "$failed" ]; then
              echo "✓ 내용 파일 전부 반영 (${attempt}번째에 성공)"
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::내용 반영이 ${max}번 모두 실패했습니다 —${failed}. 배포 로그를 함께 보세요(새 칸이 안 붙었을 수 있습니다)."
              exit 1
            fi
            echo "아직 안 되는 파일:${failed}"
            echo "배포가 아직 안 끝났을 수 있습니다. 사이트를 다시 깨우고 45초 뒤 다시 시도합니다."
            curl -fsS -o /dev/null --max-time 30 https://website.tobe211167.workers.dev/ || true
            sleep 45
            attempt=$((attempt + 1))
          done

      # 넣었다는 말만으로는 들어간 줄 모른다.
      #
      # 내용 파일은 "이름이 같은 줄이 있으면 건너뛴다" 로 쓰는데, 조직 이름이 한 글자라도
      # 다르면 **한 줄도 안 들어가고도 성공으로 끝난다**(조건에 맞는 조직이 없으면
      # INSERT ... SELECT 는 0줄을 넣고 조용히 끝난다). 반대로 조건에 맞는 조직이
      # 둘이면 두 벌이 들어가 손님 화면에 카드가 겹쳐 뜬다.
      # 둘 다 화면을 열어 보기 전에는 모르는 실패라, 여기서 눈에 보이게 만든다.
      - name: 무엇이 들어갔는지 세어 본다
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 로그와 요약 양쪽에 찍는다 — 요약은 사람이 보기 좋고, 로그는 API 로 읽힌다.
          # 행사만 세고 공지를 안 세던 구멍을 메운다: 내용 파일은 공지도 넣는다.
          show() {
            echo "### $1" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            npx --yes wrangler@4 d1 execute seocho-db --remote --yes --command "$2" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }
          show "지금 들어 있는 행사 (최근 10건)" "SELECT id, event_date, CASE WHEN cover=1 THEN '대문' ELSE '' END AS 대문, title FROM events ORDER BY id DESC LIMIT 10"
          show "지금 들어 있는 공지 (최근 10건)" "SELECT id, pinned, tag, title, CASE WHEN image='' THEN '' ELSE '사진' END AS 사진 FROM notices ORDER BY id DESC LIMIT 10"

          # 이름이 같은 행사가 둘 이상이면 두 번 들어간 것이다 — 여기서 멈춘다.
          npx --yes wrangler@4 d1 execute seocho-db --remote --yes --json \
            --command "SELECT title FROM events GROUP BY association_id, title HAVING COUNT(*) > 1 UNION ALL SELECT title FROM notices GROUP BY association_id, title HAVING COUNT(*) > 1" > /tmp/dup.json
          if grep -q '"title"' /tmp/dup.json; then
            cat /tmp/dup.json
            echo "::error::같은 이름의 행사나 공지가 두 벌 들어갔습니다. 내용 파일의 건너뛰기 조건을 보세요."
            exit 1
          fi
          echo "✓ 겹쳐 들어간 행사·공지 없음"
