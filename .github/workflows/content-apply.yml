# 내용 한 번 반영 — 홈페이지에 뜰 글을 라이브 DB 에 넣는다.
#
# 왜 이게 필요한가.
# 공지·행사는 보통 관리자 화면에서 등록한다. 그게 정상이고, 이 워크플로는 그걸 대신하지 않는다.
# 다만 포스터 여러 장을 한 번에 옮겨 적는 것처럼 **손으로 치면 오타가 나는 분량**이 있다.
# 그런 것만 cloudflare/content/*.sql 에 적어 두고 여기서 한 번 돌린다.
#
# 안전장치 —
#   · 손으로 눌러야만 돈다. 푸시로는 절대 돌지 않는다.
#   · 돌릴 파일은 **아래 목록에 있는 것만** 고를 수 있다. SQL 을 직접 써 넣는 칸은 없다
#     (그 칸을 만들면 저장소에 쓰기 권한이 있는 누구나 라이브 DB 에 아무 문장이나 넣을 수 있다).
#   · 파일은 두 번 돌려도 내용이 늘지 않게 쓴다(이미 있으면 건너뛰기).
#
# 쓰는 법: Actions 탭 → "내용 한 번 반영" → Run workflow → 파일 고르고 실행.

name: 내용 한 번 반영

on:
  workflow_dispatch:
    inputs:
      file:
        description: 돌릴 내용 파일
        required: true
        type: choice
        options:
          - cloudflare/content/2026-bangbae-festival.sql

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 새 칸(ALTER TABLE)은 배포 뒤 **첫 요청**에 붙는다. 아직 아무도 사이트를 안 열었으면
      # 칸이 없는 상태라 아래 INSERT 가 통째로 실패한다. 그래서 먼저 한 번 깨운다.
      - name: 사이트를 한 번 깨운다 (새 칸 적용)
        run: curl -fsS -o /dev/null --retry 3 --max-time 30 https://website.tobe211167.workers.dev/ || true

      - name: 무엇을 넣는지 먼저 보여 준다
        run: |
          echo '### 넣을 내용' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          cat "${{ inputs.file }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute seocho-db --remote --yes --file=${{ inputs.file }}
