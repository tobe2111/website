# 기본 브랜치에 들어온 작업을 Notion `개발 및 제작 관리` DB 에 남긴다.
#
# CLAUDE.md 의 규약은 Claude 가 작업할 때만 돈다. 사람이 직접 푸시하면 아무도 적지 않는데,
# 이 워크플로가 그 구멍을 메운다. Claude 가 이미 적은 커밋(`Notion-Logged: yes` 트레일러)은
# 스크립트가 알아서 건너뛴다.
#
# 준비물 — 저장소 Settings → Secrets and variables → Actions 에 `NOTION_TOKEN` 등록:
#   1) https://www.notion.so/profile/integrations 에서 내부 통합(internal integration) 생성
#   2) 그 통합을 `개발 및 제작 관리` DB 와 제품 페이지 3개에 연결(페이지 우상단 ··· → 연결)
#   3) 발급된 토큰(ntn_...)을 NOTION_TOKEN 으로 등록
# 토큰이 없으면 이 워크플로는 조용히 건너뜁니다 — 빌드를 빨갛게 만들지 않습니다.

name: Notion 기록

on:
  push:

permissions:
  contents: read

jobs:
  sync:
    # 기본 브랜치에 실제 커밋이 들어왔을 때만
    if: github.ref_name == github.event.repository.default_branch && github.event.created == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Notion 에 기록
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::NOTION_TOKEN 시크릿이 없어 건너뜁니다. 등록법은 이 워크플로 파일 위쪽 주석을 보세요."
            exit 0
          fi
          node .github/scripts/notion-sync.mjs
